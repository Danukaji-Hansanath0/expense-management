name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Create .env file for Build
        run: |
          touch .env
          echo "EXPO_PUBLIC_FB_API_KEY=${{ secrets.FB_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FB_MESSAGING_SENDER_ID=${{ secrets.FB_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_APP_ID=${{ secrets.FB_APP_ID }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: Build Android APK (Production)
        id: eas_build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile production --non-interactive 2>&1)
          echo "$BUILD_OUTPUT"
          
          # Extract build ID from output
          BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -oP 'Build ID: \K[a-zA-Z0-9-]+' || true)
          
          if [ -n "$BUILD_ID" ]; then
            echo "Waiting for build $BUILD_ID to complete..."
            
            # Poll build status until complete
            while true; do
              BUILD_STATUS=$(eas build:view "$BUILD_ID" --json 2>/dev/null || echo '{}')
              STATUS=$(echo "$BUILD_STATUS" | jq -r '.status // "unknown"')
              
              echo "Build status: $STATUS"
              
              if [ "$STATUS" = "finished" ]; then
                echo "Build completed successfully!"
                
                # Get artifact URL
                ARTIFACT_URL=$(echo "$BUILD_STATUS" | jq -r '.artifacts.buildUrl // empty')
                
                if [ -n "$ARTIFACT_URL" ]; then
                  echo "Downloading APK from: $ARTIFACT_URL"
                  mkdir -p dist
                  curl -L -o dist/financeflow.apk "$ARTIFACT_URL"
                  echo "APK downloaded successfully!"
                else
                  echo "Warning: Could not find artifact URL in build response"
                  echo "$BUILD_STATUS"
                fi
                break
              elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
                echo "Build failed with status: $STATUS"
                echo "$BUILD_STATUS"
                exit 1
              fi
              
              echo "Waiting 30 seconds before next status check..."
              sleep 30
            done
          else
            echo "Warning: Could not extract build ID. Build may still be processing."
            echo "Check your EAS dashboard for build status."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-Android-APK
          path: dist/financeflow.apk
          retention-days: 30

      - name: Create GitHub Release (Optional - if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/financeflow.apk
          token: ${{ secrets.GITHUB_TOKEN }}
