name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Create Environment File
        run: |
          echo "EXPO_PUBLIC_FB_API_KEY=${{ secrets.FB_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FB_MESSAGING_SENDER_ID=${{ secrets.FB_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_APP_ID=${{ secrets.FB_APP_ID }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: Link/Create EAS Project
        run: |
          # Try to init non-interactively. 
          # If project exists, it links. If not, it creates a new one under your account.
          eas init --id $(echo ${{ secrets.EXPO_PROJECT_ID }} | tr -d ' ') --non-interactive || \
          eas init --account danukaji --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS Build
        run: |
          # Ensure eas.json exists or create a basic one if missing
          if [ ! -f eas.json ]; then
            echo '{"cli": {"appVersionSource": "remote"}, "build": {"production": {"android": {"buildType": "apk"}}}}' > eas.json
          fi

      - name: Start EAS Build
        id: start_build
        run: |
          echo "Starting EAS Build..."
          # Run build and capture output to a file
          eas build --platform android --profile production --non-interactive > build_log.txt 2>&1 || true
          
          cat build_log.txt
          
          # Extract Build ID using grep
          BUILD_ID=$(grep -oP 'Build ID: \K[a-zA-Z0-9-]+' build_log.txt || echo "")
          
          if [ -z "$BUILD_ID" ]; then
            echo "❌ Failed to extract Build ID."
            exit 1
          fi
          
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "✅ Build started with ID: $BUILD_ID"

      - name: Wait for Build & Download
        run: |
          BUILD_ID=${{ steps.start_build.outputs.build_id }}
          echo "Monitoring build $BUILD_ID..."
          
          MAX_ATTEMPTS=60 # 30 minutes max
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            sleep 30
            ATTEMPT=$((ATTEMPT + 1))
            
            # Get status JSON
            STATUS_JSON=$(eas build:view $BUILD_ID --json 2>/dev/null || echo "{}")
            STATUS=$(echo $STATUS_JSON | jq -r '.status // "unknown"')
            
            echo "Attempt $ATTEMPT: Status is $STATUS"
            
            if [ "$STATUS" == "finished" ]; then
              echo "✅ Build finished!"
              
              # Extract URL
              APK_URL=$(echo $STATUS_JSON | jq -r '.artifacts.buildUrl // empty')
              
              if [ -n "$APK_URL" ]; then
                mkdir -p dist
                echo "Downloading APK..."
                curl -L -o dist/financeflow.apk "$APK_URL"
                echo "✅ APK downloaded successfully!"
                ls -lh dist/
              else
                echo "❌ No download URL found in response."
                exit 1
              fi
              break
            elif [ "$STATUS" == "errored" ] || [ "$STATUS" == "canceled" ]; then
              echo "❌ Build failed with status: $STATUS"
              exit 1
            fi
          done
          
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "⏱️ Timeout waiting for build."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-Production-APK
          path: dist/financeflow.apk
          retention-days: 30
