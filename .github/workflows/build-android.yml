name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "EXPO_PUBLIC_FB_API_KEY=${{ secrets.FB_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FB_MESSAGING_SENDER_ID=${{ secrets.FB_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_APP_ID=${{ secrets.FB_APP_ID }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env

      - name: Verify EAS Login
        run: eas whoami

      - name: Start Build
        id: start_build
        run: |
          BUILD_OUTPUT=$(eas build --platform android --profile production --non-interactive --json 2>&1)
          echo "$BUILD_OUTPUT"
          
          # Extract Build ID from JSON output
          BUILD_ID=$(echo "$BUILD_OUTPUT" | jq -r '.id')
          
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "Failed to start build or extract ID."
            echo "Raw output: $BUILD_OUTPUT"
            exit 1
          fi
          
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Build started with ID: $BUILD_ID"

      - name: Wait for Build to Complete
        id: wait_build
        run: |
          BUILD_ID="${{ steps.start_build.outputs.build_id }}"
          echo "Polling status for build $BUILD_ID..."
          
          while true; do
            STATUS_OUTPUT=$(eas build:view $BUILD_ID --json 2>&1)
            STATUS=$(echo "$STATUS_OUTPUT" | jq -r '.status')
            
            echo "Current Status: $STATUS"
            
            if [ "$STATUS" == "finished" ]; then
              echo "Build finished successfully!"
              ARTIFACT_URL=$(echo "$STATUS_OUTPUT" | jq -r '.artifacts.buildUrl')
              echo "artifact_url=$ARTIFACT_URL" >> $GITHUB_OUTPUT
              break
            elif [ "$STATUS" == "errored" ] || [ "$STATUS" == "canceled" ]; then
              echo "Build failed!"
              echo "$STATUS_OUTPUT"
              exit 1
            fi
            
            echo "Waiting 30 seconds..."
            sleep 30
          done

      - name: Download APK
        run: |
          URL="${{ steps.wait_build.outputs.artifact_url }}"
          if [ -z "$URL" ] || [ "$URL" == "null" ]; then
            echo "No artifact URL found."
            exit 1
          fi
          
          mkdir -p dist
          echo "Downloading APK from: $URL"
          curl -L -o dist/financeflow.apk "$URL"
          
          if [ -f dist/financeflow.apk ]; then
            echo "APK downloaded successfully!"
            ls -lh dist/
          else
            echo "Download failed!"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: financeflow-apk
          path: dist/financeflow.apk
          retention-days: 7
