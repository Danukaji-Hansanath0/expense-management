name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Configure EAS Credentials
        run: |
          echo "${{ secrets.EAS_TOKEN }}" | eas login --token
          
      - name: Create .env file for Build
        run: |
          touch .env
          echo "EXPO_PUBLIC_FB_API_KEY=${{ secrets.FB_API_KEY }}" >> .env
          echo "EXPO_PUBLIC_FB_AUTH_DOMAIN=${{ secrets.FB_AUTH_DOMAIN }}" >> .env
          echo "EXPO_PUBLIC_FB_PROJECT_ID=${{ secrets.FB_PROJECT_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_STORAGE_BUCKET=${{ secrets.FB_STORAGE_BUCKET }}" >> .env
          echo "EXPO_PUBLIC_FB_MESSAGING_SENDER_ID=${{ secrets.FB_MESSAGING_SENDER_ID }}" >> .env
          echo "EXPO_PUBLIC_FB_APP_ID=${{ secrets.FB_APP_ID }}" >> .env
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          cat .env # Verify (optional, remove in prod if concerned about logs)

      - name: Build Android APK (Production)
        id: eas_build
        run: |
          eas build --platform android --profile production --non-interactive --output dist/financeflow.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Ensure EAS_TOKEN is also set if using different auth method, though EXPO_TOKEN is standard for CI
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-Android-APK
          path: dist/financeflow.apk
          retention-days: 30

      - name: Create GitHub Release (Optional - if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/financeflow.apk
          token: ${{ secrets.GITHUB_TOKEN }}
